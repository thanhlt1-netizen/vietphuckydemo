    <script>
      // Suppress harmless Vite WebSocket connection errors in preview/iframe environment
      (function () {
        var suppress = function (e) {
          var msg = (e && (e.message || (e.reason && (e.reason.message || String(e.reason))))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
          return false;
        };
        window.addEventListener('unhandledrejection', suppress, true);
        window.addEventListener('error', suppress, true);

        // Also intercept console.error for WebSocket connection logs
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string' && (arg.indexOf('WebSocket') !== -1 || arg.indexOf('websocket') !== -1)) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
      })();
    </script>
